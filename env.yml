name: halflife_env
channels:
  - conda-forge
  - defaults
dependencies:
  - r-base=4.3  # Stable version for osx-64
  - r-tidyverse
  - r-janitor
  - r-openxlsx
  - r-smoother
  - r-plotrix
  - r-magick
  - r-minpack.lm
  - imagemagick  # System dependency for r-magick
  - r-languageserver # Optional: helpful if using VS Code
